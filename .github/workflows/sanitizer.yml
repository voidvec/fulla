name: Sanitizers

# #104: sanitizer gates. Tooling existed (cmake/Sanitizers.cmake + presets)
# but nothing ever ran it in CI.
#
# Jobs:
#   asan-ubsan (PR + push master + dispatch): the recommended combination --
#     ASan + UBSan compose on GCC/Clang; UBSan runs with
#     -fno-sanitize-recover so UB aborts the test process. Full ctest against
#     real PG + Redis (same provisioning as _build-test.yml's Linux leg), so
#     integration suites are covered too.
#   tsan-nightly (schedule + dispatch): ThreadSanitizer over the
#     concurrency-heavy suites (TSan's runtime is exclusive -- it cannot be
#     composed with ASan/UBSan, hence a separate nightly job). Runs the FULL
#     suite, not just -R Concurrency: the suites are interleaved in one binary
#     and a full pass is the point of the nightly cadence.
#
# First-run triage policy (PR gate): real defects are fixed in the same PR;
# third-party/system-call false positives go to tools/sanitizers/ with a
# documented suppression file. If the gate cannot be made green within
# budget, revert this workflow and keep #104 open rather than merging red.

on:
  pull_request:
    branches: ["master"]
    paths:
      - "libs/**"
      - "apps/server/**"
      - "tests/**"
      - "cmake/**"
      - "CMakePresets.json"
      - ".github/workflows/sanitizer.yml"
  push:
    branches: ["master"]
    paths:
      - "libs/**"
      - "apps/server/**"
      - "tests/**"
      - "cmake/**"
      - "CMakePresets.json"
  workflow_dispatch:

concurrency:
  group: sanitizers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan-ubsan:
    name: ASan + UBSan (linux, full suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRESET: linux-asan-ubsan
      ASAN_OPTIONS: detect_leaks=1:detect_container_overflow=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake uuid-dev redis-tools
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-v1-cpp17-debug-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-v1-cpp17-debug-

      - name: Configure CMake using Conan (Debug + address,undefined)
        run: |
          conan install . --output-folder=build/$PRESET --build=missing \
            -s build_type=Debug -s compiler.cppstd=17
          # drogon_ctl lives in the Conan package cache, not in $PATH;
          # drogon_create_views() invokes it at build time, so prepend its
          # directory for the subsequent cmake --build step (same fix the
          # coverage workflow needed -- Error 127 on apps/server/login.h).
          DROGON_BIN_DIR="$(find ~/.conan2/p -name drogon_ctl -type f -executable -printf '%h\n' | head -1)"
          if [ -z "$DROGON_BIN_DIR" ]; then
            echo "::error::drogon_ctl not found in Conan cache"
            exit 1
          fi
          echo "Found drogon_ctl in $DROGON_BIN_DIR"
          echo "$DROGON_BIN_DIR" >> "$GITHUB_PATH"
          cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name fulla-postgres \
            -e POSTGRES_USER=fulla_user -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=fulla_db -p 5432:5432 postgres:17-alpine
          docker run -d --name fulla-redis -p 6379:6379 redis:7-alpine

      - name: Wait for services and initialize database
        working-directory: ${{ github.workspace }}/apps/server
        env:
          PGPASSWORD: 123456
        run: |
          for i in $(seq 1 15); do
            PGPASSWORD=123456 psql -h localhost -U fulla_user -d fulla_db -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          PGPASSWORD=123456 psql -h localhost -U fulla_user -d fulla_db -c 'SELECT 1'
          for i in $(seq 1 15); do
            redis-cli -h localhost ping | grep -q PONG && break
            sleep 2
          done
          redis-cli -h localhost ping
          for f in migrations/V*.sql seed/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U fulla_user -d fulla_db -f "$f"
          done

      - name: Run tests (ctest, full suite)
        working-directory: build/${{ env.PRESET }}
        env:
          # LeakSanitizer needs ptrace on some runner images.
          ASAN_OPTIONS: detect_leaks=1:detect_container_overflow=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          # CI Redis has no password; override the dev config's passwd
          # (mirrors _build-test.yml's FULLA_REDIS_PASSWORD="").
          FULLA_REDIS_PASSWORD: ""
        run: ctest -C Debug --output-on-failure --timeout 300

      - name: Upload sanitizer logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: asan-ubsan-logs
          path: |
            build/${{ env.PRESET }}/Testing/
            build/${{ env.PRESET }}/apps/server/logs/
          if-no-files-found: ignore

  tsan-nightly:
    name: TSan nightly (linux, full suite)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PRESET: linux-release-tsan
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake uuid-dev redis-tools
          pip install conan
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: conan-${{ runner.os }}-v1-cpp17-debug-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-v1-cpp17-debug-

      - name: Configure CMake using Conan (Debug + thread)
        run: |
          conan install . --output-folder=build/$PRESET --build=missing \
            -s build_type=Debug -s compiler.cppstd=17
          DROGON_BIN_DIR="$(find ~/.conan2/p -name drogon_ctl -type f -executable -printf '%h\n' | head -1)"
          if [ -z "$DROGON_BIN_DIR" ]; then
            echo "::error::drogon_ctl not found in Conan cache"
            exit 1
          fi
          echo "$DROGON_BIN_DIR" >> "$GITHUB_PATH"
          cmake --preset "$PRESET"

      - name: Build
        run: cmake --build --preset "$PRESET"

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name fulla-postgres \
            -e POSTGRES_USER=fulla_user -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=fulla_db -p 5432:5432 postgres:17-alpine
          docker run -d --name fulla-redis -p 6379:6379 redis:7-alpine

      - name: Wait for services and initialize database
        working-directory: ${{ github.workspace }}/apps/server
        env:
          PGPASSWORD: 123456
        run: |
          for i in $(seq 1 15); do
            PGPASSWORD=123456 psql -h localhost -U fulla_user -d fulla_db -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          PGPASSWORD=123456 psql -h localhost -U fulla_user -d fulla_db -c 'SELECT 1'
          for i in $(seq 1 15); do
            redis-cli -h localhost ping | grep -q PONG && break
            sleep 2
          done
          redis-cli -h localhost ping
          for f in migrations/V*.sql seed/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U fulla_user -d fulla_db -f "$f"
          done

      - name: Run tests (ctest, full suite)
        working-directory: build/${{ env.PRESET }}
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          # CI Redis has no password; override the dev config's passwd
          # (mirrors _build-test.yml's FULLA_REDIS_PASSWORD="").
          FULLA_REDIS_PASSWORD: ""
        run: ctest -C Debug --output-on-failure --timeout 300

      - name: Upload TSan logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tsan-logs
          path: |
            build/${{ env.PRESET }}/Testing/
            build/${{ env.PRESET }}/apps/server/logs/
          if-no-files-found: ignore
