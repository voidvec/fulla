name: Reusable — Frontend Quality Gate

# Reusable workflow: the frontend gate called by ci.yml.
#   1. vitest unit/property tests (errorAdapter / message catalog /
#      cross-app consistency, Requirement 12.5) — DB-independent, part of the
#      FAST gate.
#   2. ESLint on both frontends (#108; previously zero lint gate).
#   3. Production builds — BOTH type-check now: admin runs tsc via its build
#      script, user's build is 'tsc && vite build' since #108.
#   4. Playwright e2e (both frontends, API-mocked via tests/e2e/helpers/
#      mock-api.ts — no backend needed), previously local-only (#108).
#      vue-tsc full .vue type-checking remains tracked separately.

on:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      # Dual-copy UI kit drift gate (P1 shared-UI strategy stage 1): the
      # admin and user components/ui directories must stay byte-identical
      # until the kit graduates to frontends/packages/ui.
      - name: UI kit dual-copy sync gate
        run: node scripts/check-ui-sync.mjs

      - name: Unit / property tests (user portal)
        working-directory: ${{ github.workspace }}/frontends/user
        run: |
          npm ci
          npm run test:unit

      - name: Unit / property tests (admin console)
        working-directory: ${{ github.workspace }}/frontends/admin
        run: |
          npm ci
          npm run test:unit

      - name: Lint (user portal, #108)
        working-directory: ${{ github.workspace }}/frontends/user
        run: npm run lint

      - name: Lint (admin console, #108)
        working-directory: ${{ github.workspace }}/frontends/admin
        run: npm run lint

      # Production build IS a type-check gate now: admin's build script is
      # `tsc && vite build`; user's build became `tsc && vite build` in #108
      # (it previously bundled without any type-check).
      - name: Production build (user portal, includes tsc type-check)
        working-directory: ${{ github.workspace }}/frontends/user
        run: npm run build

      - name: Production build (admin console, includes tsc type-check)
        working-directory: ${{ github.workspace }}/frontends/admin
        run: npm run build

      # #159: budgets live in the script; the entry-chunk cap doubles as the
      # AOT guard (the vue-i18n message compiler returning to the bundle costs
      # ~90 KB on the main chunk, far beyond the 10% headroom).
      - name: Bundle-size budget gate (#159)
        run: node scripts/check-frontend-size.mjs

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: ${{ github.workspace }}/frontends/user

      # E2E is API-mocked (tests/e2e/helpers/mock-api.ts route interception);
      # the vite dev server is started by each playwright config's webServer.
      - name: Playwright e2e (user portal)
        working-directory: ${{ github.workspace }}/frontends/user
        run: npx playwright test

      - name: Playwright e2e (admin console)
        working-directory: ${{ github.workspace }}/frontends/admin
        run: |
          npx playwright install chromium --with-deps
          npx playwright test

      - name: Upload Playwright reports on failure (user)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-user
          path: |
            frontends/user/playwright-report/
            frontends/user/test-results/
          if-no-files-found: ignore

      - name: Upload Playwright reports on failure (admin)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-admin
          path: |
            frontends/admin/playwright-report/
            frontends/admin/test-results/
          if-no-files-found: ignore

  # #160: PR-level smoke for the frontend Docker images. Node CI above never
  # builds the images, so a context/lockfile/base-image regression surfaced
  # only at release time — the worst possible timing. Mirrors the two frontend
  # builds of release.yml (admin context build + user frontend-runtime stage);
  # no push, no registry — build success is the gate. GHA layer cache keeps
  # steady-state runs near the npm-ci-and-build cost; if that still proves
  # too slow, drop to `continue-on-error: true` here rather than removing the
  # job.
  frontend-image-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Detect frontend image paths
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            images:
              - 'frontends/**'
              - 'deploy/docker/**'
              - '.github/workflows/_frontend.yml'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.images == 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Same context/file as release.yml's "Build admin image" (push: false).
      - name: Smoke build admin image
        if: steps.filter.outputs.images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontends/admin
          file: frontends/admin/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Same context/file/target as release.yml's "Build frontend image".
      - name: Smoke build user frontend image
        if: steps.filter.outputs.images == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: frontend-runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
