# RP Interop Smoke (P0-9) — the v1.5.0 P0 exit gate.
#
# Four drivers now: three standard RP libraries (openid-client / authlib /
# go-oidc) drive the authorization-code + PKCE -> token -> userinfo ->
# refresh -> end-session chain in strict mode against a real fulla stack,
# plus the P1-5 nextjs-demo Playwright smoke which drives a REAL BROWSER
# through the first-party fulla-oauth2 SDK (a different recipe from the
# three json-mode drivers). Deliberately NOT on the per-PR hot path
# (runtime): runs on master / release branches and on demand.
# See tests/interop/README.md.

name: interop

on:
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rp-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_PRESET: linux-release
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client redis-tools
          python -m pip install --upgrade pip conan

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/interop/go/go.mod

      - name: Resolve locked dependencies (Conan)
        run: |
          conan profile detect --force
          conan install . --output-folder=build/linux-release --build=missing \
            -s build_type=Release -s compiler.cppstd=17

      - name: Add drogon_ctl (Conan package) to PATH
        # drogon_create_views() invokes `drogon_ctl` as a bare command at BUILD
        # time (the server's login.csp view), so it must be on PATH — the
        # first run failed with "apps/server/login.h Error 127" without this.
        # Same discovery as _build-test.yml: read the resolved package folder
        # from CMakeDeps' Drogon-*-data.cmake instead of hardcoding the cache
        # layout.
        run: |
          data_file=$(find build/linux-release -maxdepth 1 -name 'Drogon-*-data.cmake' | head -n1)
          if [ -z "$data_file" ]; then
            echo "::error::Could not find Drogon-*-data.cmake under build/linux-release/ (conan install may have failed)"
            exit 1
          fi
          drogon_folder=$(grep -E 'set\(drogon_PACKAGE_FOLDER_RELEASE "' "$data_file" | sed -E 's/.*"(.+)".*/\1/')
          if [ -z "$drogon_folder" ]; then
            echo "::error::Could not parse drogon_PACKAGE_FOLDER_RELEASE from $data_file"
            exit 1
          fi
          drogon_bin="$drogon_folder/bin"
          if [ ! -x "$drogon_bin/drogon_ctl" ] && [ ! -f "$drogon_bin/drogon_ctl.exe" ]; then
            echo "::error::drogon_ctl not found under $drogon_bin"
            exit 1
          fi
          echo "Adding $drogon_bin to PATH"
          echo "$drogon_bin" >> "$GITHUB_PATH"

      - name: Configure + build server
        run: |
          cmake --preset "$CMAKE_PRESET"
          cmake --build --preset "$CMAKE_PRESET" --target fulla-server

      - name: Start PostgreSQL and Redis
        run: |
          docker run -d --name fulla-postgres \
            -e POSTGRES_USER=fulla_user \
            -e POSTGRES_PASSWORD=123456 \
            -e POSTGRES_DB=fulla_db \
            -p 5432:5432 postgres:17-alpine
          docker run -d --name fulla-redis \
            -p 6379:6379 redis:7-alpine

      - name: Wait for services and initialize schema + seeds
        working-directory: apps/server
        env:
          PGPASSWORD: 123456
        run: |
          for i in $(seq 1 15); do
            psql -h localhost -U fulla_user -d fulla_db -c 'SELECT 1' >/dev/null 2>&1 && break
            sleep 2
          done
          for f in migrations/V*.sql seed/*.sql; do
            echo "Applying $f..."
            psql -h localhost -U fulla_user -d fulla_db -f "$f"
          done

      - name: Boot fulla-server
        working-directory: apps/server/config
        run: |
          nohup "$GITHUB_WORKSPACE/build/linux-release/apps/server/fulla-server" \
            > /tmp/fulla-server-interop.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5555/health >/dev/null && exit 0
            sleep 1
          done
          echo "::error::server failed to become healthy"
          cat /tmp/fulla-server-interop.log
          exit 1

      - name: Node driver (openid-client v6)
        working-directory: tests/interop/node
        run: |
          npm install --no-fund --no-audit
          node rp-smoke.mjs

      - name: Python driver (authlib)
        run: |
          python -m pip install -r tests/interop/python/requirements.txt
          python tests/interop/python/rp_smoke.py

      - name: Go driver (go-oidc + x/oauth2)
        run: go run ./tests/interop/go

      - name: Demo driver (fulla-oauth2 SDK via real browser, P1-5)
        # Fourth driver: unlike the json-mode RP libraries above, this
        # drives a real browser through examples/nextjs-demo — landing ->
        # fulla login form -> callback (state+PKCE verified) -> profile
        # (userinfo) -> protected API -> RP-initiated logout.
        working-directory: examples/nextjs-demo
        env:
          FULLA_BASE_URL: http://localhost:5555
          FULLA_CLIENT_ID: fulla-portal
          FULLA_REDIRECT_URI: http://localhost:8080/callback
          FULLA_POST_LOGOUT_URI: http://localhost:8080/callback
          DEMO_BASE_URL: http://localhost:8080
        run: |
          # The demo consumes fulla-oauth2 via file:../../clients/ts — build
          # its dist/ exactly like an npm consumer would receive.
          (cd ../../clients/ts && npm ci && npm run build)
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx next start -p 8080 > /tmp/nextjs-demo.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/ >/dev/null || {
            echo "::error::nextjs-demo failed to boot"
            tail -n 50 /tmp/nextjs-demo.log
            exit 1
          }
          npx playwright test
          pkill -f "next start" 2>/dev/null || true

      - name: Server log on failure
        if: failure()
        run: tail -n 200 /tmp/fulla-server-interop.log || true
