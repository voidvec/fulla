name: Website

# Phase B of the docs governance plan (docs/documentation-governance.md §四):
# the site is built straight from the repo's docs/ tree (zero copies), so it
# rebuilds only when docs or the site itself change. Broken links throw at
# build time — the CI gate replaces manual link checking.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'blog/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  # Manual deploy: lets the site go live from a branch before merge (requires
  # Pages Source = GitHub Actions in repo settings). The operator triggers
  # this deliberately; normal production deploys stay master-push-only.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
