name: Optional Feature Matrix

on:
  pull_request:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'conan.lock'
      - 'cmake/**'
      - 'libs/**'
      - 'apps/server/**'
      - 'tests/**'
      - 'examples/full-stack-host/**'
      - 'tools/feature-matrix/**'
      - '.github/workflows/feature-matrix.yml'
  push:
    branches: [master]
    paths:
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'conan.lock'
      - 'cmake/**'
      - 'libs/**'
      - 'apps/server/**'
      - 'tests/**'
      - 'examples/full-stack-host/**'
      - 'tools/feature-matrix/**'
      - '.github/workflows/feature-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optional-features-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trimmed:
    name: Social ${{ matrix.social }} / WebAuthn ${{ matrix.webauthn }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ON/ON is already covered by the primary cross-platform CI.
          - {social: 'OFF', webauthn: 'ON'}
          - {social: 'ON', webauthn: 'OFF'}
          - {social: 'OFF', webauthn: 'OFF'}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fulla_user
          POSTGRES_PASSWORD: feature-matrix-fixture
          POSTGRES_DB: fulla_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fulla_user -d fulla_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FULLA_DB_HOST: 127.0.0.1
      FULLA_DB_PORT: '5432'
      FULLA_DB_USER: fulla_user
      FULLA_DB_PASSWORD: feature-matrix-fixture
      FULLA_DB_NAME: fulla_db
      FULLA_REDIS_HOST: 127.0.0.1
      FULLA_REDIS_PORT: '6379'
      FULLA_REDIS_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev redis-tools ninja-build
          pip install conan
          conan profile detect --force
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.conan2
          key: optional-conan-${{ runner.os }}-cpp17-${{ matrix.social }}-${{ matrix.webauthn }}-${{ hashFiles('conanfile.py', 'conan.lock') }}
          restore-keys: |
            conan-${{ runner.os }}-v1-cpp17-
      - name: Build, test, and consume installed SDK
        run: >-
          python tools/feature-matrix/run.py
          --social ${{ matrix.social }} --webauthn ${{ matrix.webauthn }}
          --build-dir build/optional --evidence-dir feature-evidence
          --generator Ninja --jobs 4
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: optional-social-${{ matrix.social }}-webauthn-${{ matrix.webauthn }}
          path: feature-evidence/
