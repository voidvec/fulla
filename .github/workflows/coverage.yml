name: Coverage

# #105: produce AND gate line coverage on Linux. FULLA_TEST_COVERAGE +
# cmake/Coverage.cmake instrument every first-party lib; scripts/
# measure_coverage.py aggregates the gcov JSON into a per-library report and
# enforces the local ratchet (decision B, 2026-09-03): any non-exempt library
# dropping more than 0.5pp below tools/coverage/ratchet-baseline.json fails
# the build. Re-baselining (including upward) is a deliberate reviewed PR
# edit of the JSON. Codecov-style external hosting remains deliberately out
# (self-contained gate, consistent with api-diff/oasdiff/spec-governance);
# artifacts carry the raw data meanwhile.
#
# Two legs over one reusable body (.github/workflows/_coverage-run.yml):
#
#   PR leg      pull_request → advisory, 60 min. The gcov-instrumented
#               server is 10-20x slower than Release; the full 61k-assertion
#               suite (3.5 min at Release) needs 35-70 min instrumented and
#               does not fit alongside the ~29 min build in 60 min — partial
#               .gcda still feeds the reported ratio (conservative
#               denominator). Correctness stays gated by Build&Test + ASan.
#   GATE leg    push master + nightly (03:30 UTC) + dispatch → 150 min,
#               suite completion REQUIRED and the ratchet is a hard gate.
#               Restores the v1.6.0-degraded no-decrease guarantee: a
#               coverage regression fails within a day of merge, instead of
#               either a multi-hour leg on every PR or no gate at all.
#
# Why not the two originally considered alternatives (evaluation, 2026-11-07,
# figures from run 42323015819): ctest-level suite sharding is structurally
# blocked — OAuth2Tests is ONE add_test() over the monolithic fulla-tests
# binary, and per-case add_test(-r <name>) invocations would re-bootstrap
# the in-process server for every case (the Contract suite can do it only
# because its cases are repository-only); splitting the binary is a build-
# system refactor out of proportion for a 3.5-min-Release suite. A dedicated
# larger runner would work but is unnecessary once the ceiling is honestly
# sized (100 min fits the standard hosted runner; max is 360).

on:
  workflow_dispatch:
    inputs:
      gating:
        description: 'Run as the hard-gate leg (150 min, ratchet enforced)'
        type: boolean
        default: true
  pull_request:
    branches: ["master"]
    paths:
      - "libs/**"
      - "apps/server/**"
      - "tests/**"
      - "scripts/measure_coverage.py"
      - "tools/coverage/**"
      - "cmake/Coverage.cmake"
      - "CMakePresets.json"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/_coverage-run.yml"
  push:
    branches: ["master"]
    paths:
      - "libs/**"
      - "apps/server/**"
      - "tests/**"
      - "tools/coverage/**"
      - ".github/workflows/coverage.yml"
      - ".github/workflows/_coverage-run.yml"
  schedule:
    # Nightly gate leg: after tsan-nightly (03:00 UTC) with a clear gap.
    - cron: "30 3 * * *"

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisory:
    name: gcov line coverage (linux, advisory)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_coverage-run.yml
    with:
      gating: false
      timeout_minutes: 60

  gate:
    name: gcov line coverage (linux, GATE)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_coverage-run.yml
    with:
      # dispatch(false) keeps manual runs fast/advisory if the operator
      # opts out; push master + nightly always gate.
      gating: ${{ github.event_name != 'workflow_dispatch' || inputs.gating }}
      timeout_minutes: 150
