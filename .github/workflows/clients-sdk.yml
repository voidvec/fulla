name: Client SDKs

# Generated-code freshness + unit tests for clients/python and clients/go
# (client-sdk M1/M2, design: docs/productization-evolution/in-progress/
# client-sdk-facility-design.md section 11.5).
#
# Kept OUTSIDE ci.yml's static-checks on purpose: that job is source-only
# (no toolchains); this workflow needs Python + Go + Node + the pinned
# generators. Path-filtered so unrelated PRs are not affected.
#
# Local equivalents:
#   python tools/clients/regen_clients.py --check --python-only
#   python tools/clients/regen_clients.py --check --go-only
#   python tools/clients/regen_clients.py --check --ts-only
#   (cd clients/python && pytest)
#   (cd clients/go && go test ./...)
#   (cd clients/ts && npm run check)

on:
  pull_request:
    branches: ["master"]
    paths:
      - "clients/**"
      - "tools/clients/**"
      - "apps/server/openapi.yaml"
      - ".github/workflows/clients-sdk.yml"
  push:
    branches: ["master"]
    paths:
      - "clients/**"
      - "tools/clients/**"
      - "apps/server/openapi.yaml"
      - ".github/workflows/clients-sdk.yml"
  workflow_dispatch:

concurrency:
  group: clients-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python client (drift + unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned generator + package (dev extras)
        run: |
          pip install openapi-python-client==0.29.0
          pip install -e '.[dev]'

      - name: Drift gate (committed generated tree must match the spec)
        working-directory: .
        run: python tools/clients/regen_clients.py --check --python-only

      - name: Unit tests (MockTransport; integration suite auto-skips)
        run: pytest tests

  go:
    name: Go client (drift + build + unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/go
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: clients/go/go.mod
          cache: true
          cache-dependency-path: clients/go/go.sum

      - name: Build + vet
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Drift gate (committed generated tree must match the spec)
        working-directory: .
        run: python tools/clients/regen_clients.py --check --go-only

      - name: Unit tests (httptest; integration suite behind -tags integration)
        run: go test ./...

  ts:
    name: TS client (drift + build + unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: clients/ts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/ts/package-lock.json

      - name: Install pinned generator (devDependency)
        run: npm ci

      - name: Drift gate (committed generated tree must match the spec)
        working-directory: .
        run: python tools/clients/regen_clients.py --check --ts-only

      - name: Version linkage (package.json == pyproject == cmake)
        working-directory: .
        run: python tools/clients/regen_clients.py --version-only

      - name: Build + unit tests (tsc emit + vitest red lines)
        run: npm run check
