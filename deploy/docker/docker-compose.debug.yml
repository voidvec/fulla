services:
  # PostgreSQL for testing
  fulla-postgres-debug:
    image: postgres:17-alpine
    container_name: fulla-postgres-debug
    environment:
      POSTGRES_USER: fulla_user
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: fulla_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulla_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fulla-debug-net

  # Redis for testing
  fulla-redis-debug:
    image: redis:7-alpine
    container_name: fulla-redis-debug
    command: redis-server --requirepass redis_secret_pass
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fulla-debug-net

  # Linux debug environment
  debug-env:
    image: fulla-backend-debug:v1.3.1
    container_name: fulla-backend-debug
    volumes:
      # Mount the entire project directory
      - ../..:/app:cached
      # Build cache to speed up rebuilds
      - oauth2-build-cache:/build-cache
    working_dir: /app
    # Keep container running for interactive debugging
    stdin_open: true
    tty: true
    # Depends on databases to be ready
    depends_on:
      fulla-postgres-debug:
        condition: service_healthy
      fulla-redis-debug:
        condition: service_healthy
    command: /bin/bash
    environment:
      - DISPLAY=${DISPLAY:-}
      # PostgreSQL connection info
      - FULLA_DB_HOST=fulla-postgres-debug
      - FULLA_DB_PORT=5432
      - FULLA_DB_USER=fulla_user
      - FULLA_DB_PASSWORD=123456
      - FULLA_DB_NAME=fulla_db
      # Redis connection info
      - FULLA_REDIS_HOST=fulla-redis-debug
      - FULLA_REDIS_PORT=6379
      - FULLA_REDIS_PASSWORD=redis_secret_pass
    networks:
      - fulla-debug-net

volumes:
  oauth2-build-cache:
    name: fulla_build_cache
  pgdata:
    name: fulla_postgres_debug
  redisdata:
    name: fulla_redis_debug

networks:
  fulla-debug-net:
    driver: bridge
