worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Runtime DNS resolution (#212): nginx resolves proxy_pass hostnames once
    # at config load and caches the IP forever. When fulla-backend/frontend/
    # admin containers are recreated (image bump) Docker may reuse the freed
    # IP for another container, so the SPA upstreams started routing to the
    # wrong service (root 302-redirecting to /admin/). Routing through a
    # variable forces the resolver on every request instead: 127.0.0.11 is
    # the Docker embedded DNS, and valid=10s caps the staleness window after
    # a recreation. ipv6=off avoids AAAA lookups (Docker DNS has none; the
    # lookup would stall).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name _;

        # TLS configuration
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # API and OAuth2 endpoints → backend
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            set $backend_upstream http://fulla-backend:5555;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/ {
            limit_req zone=api burst=20 nodelay;
            set $backend_upstream http://fulla-backend:5555;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/login {
            limit_req zone=login burst=3 nodelay;
            set $backend_upstream http://fulla-backend:5555;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            set $backend_upstream http://fulla-backend:5555;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            set $backend_upstream http://fulla-backend:5555;
            proxy_pass $backend_upstream;
        }

        location /metrics {
            # Restrict to internal networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            deny all;
            set $backend_upstream http://fulla-backend:5555;
            proxy_pass $backend_upstream;
        }

        # Admin console
        location /admin/ {
            set $admin_upstream http://fulla-admin;
            proxy_pass $admin_upstream;
            proxy_set_header Host $host;
        }

        # Frontend SPA (default)
        location / {
            set $frontend_upstream http://fulla-frontend;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}
