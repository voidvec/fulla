server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Relative Location on redirects: the container listens on 80 but is
    # mapped to an arbitrary host port (8081 in deploy/docker) — nginx's
    # default absolute URL would drop the mapped port and send browsers to
    # http://localhost/admin/.
    absolute_redirect off;

    # P1-1 (#279): CSP created at the nginx layer, evaluated together with
    # the user SPA (same posture: img-src allows remote https logos for the
    # brand surfaces; script/connect stay 'self').
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Redirect root to /admin/
    location = / {
        return 302 /admin/;
    }

    # Admin Console SPA
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Handle /admin without trailing slash
    location = /admin {
        return 301 /admin/;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://fulla-backend:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://fulla-backend:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://fulla-backend:5555;
    }

    location /.well-known/ {
        proxy_pass http://fulla-backend:5555;
        proxy_set_header Host $host;
    }
}
