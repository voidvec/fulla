server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # P1-1 (#279): CSP created at the nginx layer (the SPA previously had NO
    # Content-Security-Policy; drogon's CSP applies only to backend-rendered
    # responses and cannot be relaxed per-page). img-src allows remote https
    # logos for the consent/login brand surfaces; everything else stays
    # 'self'-locked. Logos render via <img src> only (SVG inert in img
    # context), so no script/style surface is widened.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (used when running in docker-compose without top-level nginx)
    location /api/ {
        proxy_pass http://fulla-backend:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth2/ {
        proxy_pass http://fulla-backend:5555;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        proxy_pass http://fulla-backend:5555;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://fulla-backend:5555;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
