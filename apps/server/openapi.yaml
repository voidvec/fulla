  /api/admin/users:
    get:
      description: >-
        List users with optional pagination (page, per_page) and filtering
        (q for username/email prefix, role, locked). Returns total count.
      operationId: get_api_admin_users
      parameters:
      - description: Page number (1-based)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 1
      - description: Items per page (1-100)
        in: query
        name: per_page
        required: false
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      - description: Search by username or email prefix
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Filter by role name
        in: query
        name: role
        required: false
        schema:
          type: string
      - description: Filter by lock state (true = locked, false = active)
        in: query
        name: locked
        required: false
        schema:
          type: string
          enum: ["true", "false"]
      responses:
        '200':
          description: Users list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List Users
      tags:
      - Admin
      - Users
    post:
      description: >-
        Create a new user. Requires username and password; email, roles,
        mfa_enabled, email_verified, must_change_password, and org_id are
        optional. must_change_password (default false, #145) forces the user
        to change the password at first login.
      operationId: post_api_admin_users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
                email:
                  type: string
                email_verified:
                  type: boolean
                mfa_enabled:
                  type: boolean
                must_change_password:
                  type: boolean
                  description: 'Force a password change at first login (#145);
                    while flagged, no authorization codes are issued for the
                    account. Default false.'
                org_id:
                  type: integer
                  nullable: true
                roles:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: >-
            User created successfully. The response body reports role
            assignment outcome: roles_assigned (names landed), roles_failed
            (requested names that did not land — unresolved or insert
            failures), and a warning field when roles_failed is non-empty.
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
      summary: Create User
      tags:
      - Admin
      - Users
  /api/admin/users/{userId}:
    delete:
      description: >-
        Soft-delete a user account (sets deleted_at). The user is excluded
        from all queries and can no longer log in. Outstanding access and
        refresh tokens are revoked (matched on both the public subject and
        the internal id) before the response is sent; the 200 body reports
        tokens_revoked (false + warning on revocation failure).
      operationId: delete_api_admin_users_{userId}
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: User deleted successfully (see tokens_revoked in the body)
        '400':
          description: Cannot delete your own account
        '404':
          description: User not found
        '409':
          description: The target is the last active admin
      security:
      - bearerAuth: []
      summary: Delete User
      tags:
      - Admin
      - Users
    get:
      description: Get detailed information about a specific user including roles and
        account status.
      operationId: get_api_admin_users_{userId}
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                properties:
                  created_at:
                    type: string
                  email:
                    type: string
                  email_verified:
                    type: boolean
                  failed_login_count:
                    type: integer
                  id:
                    type: integer
                  locked:
                    type: boolean
                  locked_until:
                    type: integer
                  mfa_enabled:
                    type: boolean
                  org_id:
                    type: integer
                    nullable: true
                  roles:
                    items:
                      type: string
                    type: array
                  status:
                    type: string
                  username:
                    type: string
                type: object
          description: User details (org_id is null when the user has no org)
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Get User Detail
      tags:
      - Admin
      - Users
    put:
      description: >-
        Update user information. Updatable fields: username, email,
        email_verified, mfa_enabled, must_change_password (#145; enforcement
        starts at the user's next login), locked (true locks the account),
        and org_id (integer sets it; JSON null clears it). Fields with a
        wrong JSON type are rejected with 400 (never silently skipped).
      operationId: put_api_admin_users_{userId}
      parameters:
      - description: User ID
        in: path
        name: userId
        required: true
        schema:
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                username:
                  type: string
                email:
                  type: string
                email_verified:
                  type: boolean
                mfa_enabled:
                  type: boolean
                must_change_password:
                  type: boolean
                  description: 'Set/clear the forced password-change flag (#145);
                    enforcement starts at the user''s next login.'
                locked:
                  type: boolean
                org_id:
                  type: integer
                  nullable: true
              type: object
      responses:
        '200':
          description: User updated successfully
        '400':
          description: Invalid field type or no updatable fields provided
        '404':
          description: User not found
        '409':
          description: >-
            Conflict — the target is the last active admin and the update
            would lock them out of the management plane (e.g. locked=true)
      security:
      - bearerAuth: []
      summary: Update User
      tags:
      - Admin
      - Users
