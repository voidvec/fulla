  /api/github/login:
    post:
      description: Exchange GitHub authorization code for user information. This endpoint
        handles the server-side OAuth2 flow with GitHub.
      operationId: post_api_github_login
      parameters:
      - description: Authorization code from GitHub OAuth2 callback (required)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLoginTokenResponse'
          description: First-party token pair issued for the GitHub-linked local account. (Spec correction #70 - the previously documented profile object was stale; the runtime has returned tokens since the account-linking flow landed.)
        '400':
          description: Invalid request (missing or invalid code)
        '403':
          description: Provider identity is not linked to a local account and first-login auto-create is disabled (AUTH_SOCIAL_ACCOUNT_NOT_LINKED)
        '502':
          description: Failed to contact GitHub API
      summary: GitHub OAuth2 Login
      tags:
      - External Auth
      - GitHub
  /api/google/login:
    post:
      description: Exchange Google authorization code for user information. This endpoint
        handles the server-side OAuth2 flow with Google Identity Platform.
      operationId: post_api_google_login
      parameters:
      - description: Authorization code from Google OAuth2 callback (required)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                access_token: eyJhbGciOi...
                expires_in: 3600
                refresh_token: eyJhbGciOi...
                token_type: Bearer
              schema:
                $ref: '#/components/schemas/SocialLoginTokenResponse'
          description: First-party token pair issued for the Google-linked local account (the pre-#70 profile-only object is still returned when the service runs without an account repository - degraded mode, not the deployed configuration)
        '400':
          content:
            application/json:
              example:
                error: Missing code parameter
          description: Invalid request (missing or invalid code)
        '403':
          description: Provider identity is not linked to a local account and first-login auto-create is disabled (AUTH_SOCIAL_ACCOUNT_NOT_LINKED)
        '502':
          description: Failed to contact Google API
      summary: Google OAuth2 Login
      tags:
      - External Auth
      - Google
  /api/me:
    delete:
      description: Soft-delete the current user's account.
      operationId: delete_api_me
      responses:
        '200':
          description: Account deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Delete Account
      tags:
      - User Profile
    get:
      description: Get current user's profile information. The 200 body includes
        username, email, email_verified, mfa_enabled, and must_change_password
        (#145; true while the account must change its password at first login).
      operationId: get_api_me
      responses:
        '200':
          description: User profile
        '401':
          description: Unauthorized
        '403':
          description: 'insufficient_scope -- the access token lacks the `profile`
            scope (RFC 6750 §3; accompanied by WWW-Authenticate: Bearer
            error="insufficient_scope", scope="profile"). F-010.'
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Get User Profile
      tags:
      - User Profile
  /api/me/authorized-apps:
    get:
      description: List OAuth2 clients authorized by the current user.
      operationId: get_api_me_authorized-apps
      responses:
        '200':
          description: Authorized apps list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List Authorized Apps
      tags:
      - User Profile
  /api/me/authorized-apps/{clientId}:
    delete:
      description: Revoke the current user's authorization for a specific OAuth2 client.
      operationId: delete_api_me_authorized-apps_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Authorization revoked successfully
        '401':
          description: Unauthorized
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Revoke App Authorization
      tags:
      - User Profile
  /api/me/mfa/disable:
    post:
      description: Disable MFA (TOTP) for the authenticated user.
      operationId: post_api_me_mfa_disable
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: MFA disabled successfully
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
      security:
      - bearerAuth: []
      summary: Disable MFA
      tags:
      - MFA
  /api/me/mfa/setup:
    post:
      description: Initiate MFA setup by generating a TOTP secret. Returns the base32
        secret and an otpauth:// URI for authenticator apps / QR codes.
      operationId: post_api_me_mfa_setup
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret:
                    type: string
                    description: Base32 TOTP shared secret.
                  otpauth_uri:
                    type: string
                    description: otpauth:// provisioning URI (encode as QR for authenticators).
                  message:
                    type: string
                required:
                - secret
                - otpauth_uri
          description: MFA setup initiated
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
      security:
      - bearerAuth: []
      summary: Setup MFA
      tags:
      - MFA
  /api/me/mfa/verify:
    post:
      description: Verify a 6-digit TOTP code to finalize MFA setup. Returns 10
        single-use backup codes on success.
      operationId: post_api_me_mfa_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  description: 6-digit TOTP code from the user's authenticator.
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backup_codes:
                    type: array
                    items:
                      type: string
                    description: 10 single-use backup codes.
                  warning:
                    type: string
          description: MFA enabled successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing or non-6-digit code
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token, MFA not configured, or wrong code
      security:
      - bearerAuth: []
      summary: Verify MFA Setup
      tags:
      - MFA
  /api/me/password:
    put:
      description: Change the current user's password. A successful change also
        clears the must_change_password flag (#145) and revokes all existing
        tokens. For the forced first-login flow (no Bearer token available) use
        POST /oauth2/password/change instead.
      operationId: put_api_me_password
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized or current password incorrect
        '404':
          description: User not found
      security:
      - bearerAuth: []
      summary: Change Password
      tags:
      - User Profile
  /api/me/social/links:
    get:
      description: List the social provider identities (github/google/wechat)
        linked to the current user. The seeded password-subject mapping
        (provider=local) is not a social identity and is excluded. Requires
        the `profile` scope.
      operationId: get_api_me_social_links
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLinksList'
          description: Linked social identities
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: User not found
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Social linking not configured or repository failure
      security:
      - bearerAuth: []
      summary: List Linked Social Accounts
      tags:
      - User Profile
  /api/me/social/links/{provider}/authorize:
    post:
      description: 'Begin a social link flow (#71): mint a one-time state
        bound to (current user, provider) and return the provider authorize
        URL (with the state embedded) the SPA must redirect to. The link-back
        POST must present the same state; tokens are single-use with a short
        TTL. Fails closed (500) when linking or the state store (Redis) is
        not configured. Requires the `profile` scope.'
      operationId: post_api_me_social_links_provider_authorize
      parameters:
      - description: Social provider name
        in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [github, google, wechat]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  provider:
                    type: string
                  state:
                    type: string
                  authorize_url:
                    type: string
          description: One-time state minted; authorize_url to redirect to
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported provider
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Linking or state store not configured; provider not configured
      security:
      - bearerAuth: []
      summary: Begin Social Link (mint one-time state)
      tags:
      - User Profile
  /api/me/social/links/{provider}:
    delete:
      description: Remove the current user's linked identity for a provider.
        Existing sessions issued through that provider are NOT revoked --
        they stay valid until natural expiry. The provider identity cannot
        be used for new sign-ins until it is linked to an account again.
        Refused with 409 when it is the user's last social link and the user
        has no usable password (last-credential guard). Requires the
        `profile` scope.
      operationId: delete_api_me_social_links_provider
      parameters:
      - description: Social provider name
        in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [github, google, wechat]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLinkResult'
          description: Social account unlinked successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported provider
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: No linked account for this provider
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Last-credential guard refused the unlink
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Repository failure
      security:
      - bearerAuth: []
      summary: Unlink Social Account
      tags:
      - User Profile
    post:
      description: Verify a provider authorization code (the SPA completes
        the provider redirect and submits the code) and link that provider
        identity to the current user. Conflicts (409) when the identity is
        already linked to any account or the user already has a different
        mapping for the provider. Requires the `profile` scope.
      operationId: post_api_me_social_links_provider
      parameters:
      - description: Social provider name
        in: path
        name: provider
        required: true
        schema:
          type: string
          enum: [github, google, wechat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, state]
              properties:
                code:
                  type: string
                  description: Authorization code from the provider's OAuth2
                    callback.
                state:
                  type: string
                  description: The one-time state token from the authorize
                    step (single use, bound to this user and provider).
                    Unknown/expired/replayed or foreign-bound states are
                    rejected with 400 before any provider call (#71).
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialLinkResult'
          description: Social account linked successfully
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Unsupported provider, missing code/state, invalid or
            expired link state, or provider rejected the code
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: User not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Provider identity already linked
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Social linking not configured or repository failure
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Failed to contact the provider API
      security:
      - bearerAuth: []
      summary: Link Social Account
      tags:
      - User Profile
  /api/me/webauthn/credentials:
    get:
      description: List registered WebAuthn credentials.
      operationId: get_api_me_webauthn_credentials
      responses:
        '200':
          description: WebAuthn credentials list
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: List WebAuthn Credentials
      tags:
      - WebAuthn
  /api/me/webauthn/register/begin:
    post:
      description: 'Start passkey registration (#142): ES256-only pubKeyCredParams,
        userVerification=required, user.id is the base64url of the internal
        user id bytes, excludeCredentials lists already-registered credentials,
        and the challenge is bound to the Bearer subject (no session cookie
        contract). Requires webauthn.rp_origins to be configured.'
      operationId: post_api_me_webauthn_register_begin
      responses:
        '200':
          description: WebAuthn registration options
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: WebAuthn Register Begin
      tags:
      - WebAuthn
  /api/me/webauthn/register/finish:
    post:
      description: 'Finish passkey registration (#142): the browser PublicKeyCredential
        is verified server-side (subject-bound challenge, origin allowlist,
        none-format attestation, ES256 COSE key) before anything is stored;
        the legacy {credential_id, public_key} body is rejected.'
      operationId: post_api_me_webauthn_register_finish
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnRegistrationCredential'
        required: true
      responses:
        '201':
          description: Passkey registered successfully
        '400':
          description: Invalid request or failed verification (WEBAUTHN_INVALID_ATTESTATION
            / WEBAUTHN_CHALLENGE_MISMATCH)
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: WebAuthn Register Finish
      tags:
      - WebAuthn
  /api/password-reset/confirm:
    post:
      description: Confirm a password reset using the token sent via email.
      operationId: post_api_password-reset_confirm
      responses:
        '200':
          description: Password reset successful
        '400':
          description: Invalid or expired token
      summary: Confirm Password Reset
      tags:
      - User Verification
  /api/password-reset/request:
    post:
      description: Request a password reset link to be sent via email.
      operationId: post_api_password-reset_request
      responses:
        '200':
          description: Reset link sent if the email exists
        '400':
          description: Invalid request
      summary: Request Password Reset
      tags:
      - User Verification
  /api/register:
    post:
      description: Registers a new user account into the system.
      operationId: post_api_register
      parameters:
      - description: Desired username (required)
        in: query
        name: username
        required: true
        schema:
          type: string
      - description: Strong password (required)
        in: query
        name: password
        required: true
        schema:
          minLength: 8
          type: string
      - description: Email address (optional)
        in: query
        name: email
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                message: User registered successfully
                status: success
          description: User registered successfully
        '400':
          description: Invalid registration data
      summary: Register new user
      tags:
      - User
      - Registration
  /api/verify-email:
    get:
      description: Verify an email address using a token.
      operationId: get_api_verify-email
      responses:
        '200':
          description: Email verified successfully
        '400':
          description: Invalid or expired token
      summary: Verify Email
      tags:
      - User Verification
  /api/verify-email/resend:
    post:
      description: Resend the email verification link.
      operationId: post_api_verify-email_resend
      responses:
        '200':
          description: Verification email sent
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: User not found
      summary: Resend Verification Email
      tags:
      - User Verification
  /api/verify-email/resend-by-email:
    post:
      description: "Resend the email verification link, identifying the account by email address. Unauthenticated (see issue 198): a self-registered user holds no token yet. Rate-limited per (ip, email) with an identical response for unknown, already-verified, and emailed addresses (anti-enumeration)."
      operationId: post_api_verify-email_resend-by-email
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
              required:
              - email
              type: object
      responses:
        '200':
          description: Verification email sent if the email exists and is unverified
        '400':
          description: Invalid request
        '429':
          description: Rate limited
      summary: Resend Verification Email (by email address)
      tags:
      - User Verification
  /api/wechat/login:
    post:
      description: Exchange WeChat authorization code for user information. This endpoint
        handles the server-side OAuth2 flow with WeChat Open Platform.
      operationId: post_api_wechat_login
      parameters:
      - description: Authorization code from WeChat OAuth2 callback (required)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              example:
                access_token: eyJhbGciOi...
                expires_in: 3600
                refresh_token: eyJhbGciOi...
                token_type: Bearer
              schema:
                $ref: '#/components/schemas/SocialLoginTokenResponse'
          description: First-party token pair issued for the WeChat-linked local account (the pre-#70 profile-only object is still returned when the service runs without an account repository - degraded mode, not the deployed configuration)
        '400':
          content:
            application/json:
              example:
                error: Missing code parameter
          description: Invalid request (missing or invalid code)
        '403':
          description: Provider identity is not linked to a local account and first-login auto-create is disabled (AUTH_SOCIAL_ACCOUNT_NOT_LINKED)
        '502':
          description: Failed to contact WeChat API
      summary: WeChat OAuth2 Login
      tags:
      - External Auth
      - WeChat
  /health:
    get:
      description: Aggregate health status of the service (process + database).
      operationId: get_health
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Service is healthy (or partially — inspect status field)
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Service unhealthy
      summary: Health check
      tags:
      - System
  /health/live:
    get:
      description: Liveness probe — always 200 while the process is up (no dependency
        checks).
      operationId: get_health_live
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Service is alive
      summary: Liveness probe
      tags:
      - System
  /health/ready:
    get:
      description: Readiness probe — database / redis dependency checks; 503 when a
        required dependency is down.
      operationId: get_health_ready
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Service is ready
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
          description: Service degraded or unhealthy (inspect status/database/redis)
      summary: Readiness probe
      tags:
      - System
  /oauth2/authorize:
    get:
      description: 'OAuth2 authorization endpoint - initiates authorization flow.
        Sessions paused at the MFA challenge or flagged must_change_password
        (#144/#145) are treated as not fully authenticated: prompt=none answers
        error=login_required, silent requests are redirected to the login /
        password-change page instead of issuing a code.'
      operationId: get_oauth2_authorize
      parameters:
      - description: Client identifier (required)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: Redirect URI (required)
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: Response type, must be 'code' (required)
        in: query
        name: response_type
        required: true
        schema:
          type: string
      - description: Requested scope (optional)
        in: query
        name: scope
        required: false
        schema:
          type: string
      - description: Opaque value to maintain state between request and callback (recommended)
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: PKCE code challenge (RFC 7636). Required for public clients
          when auth.require_pkce_for_public is enabled (default true).
        in: query
        name: code_challenge
        required: false
        schema:
          type: string
      - description: PKCE code challenge method ('plain' or 'S256')
        in: query
        name: code_challenge_method
        required: false
        schema:
          type: string
      - description: OIDC nonce (anti-replay). Echoed in the id_token when openid
          scope is requested.
        in: query
        name: nonce
        required: false
        schema:
          type: string
      - description: 'OIDC prompt values, space-separated (none|login|consent).
          none forbids UI; login forces re-auth; consent forces the consent
          screen. Combining none with another value returns 400. (OIDC Core
          §3.1.2.1)'
        in: query
        name: prompt
        required: false
        schema:
          type: string
      - description: Maximum allowable age in seconds of the user's authentication.
          If the session auth_time is older, re-authentication is forced.
        in: query
        name: max_age
        required: false
        schema:
          type: integer
      responses:
        '302':
          description: Redirect to client with authorization code (or an error=
            redirect for prompt=none / invalid_scope / etc.)
        '400':
          description: Invalid request (malformed prompt, missing required params)
      summary: Request authorization
      tags:
      - OAuth2
      - Authorization
  /oauth2/consent:
    post:
      description: Submit user consent for requested scopes. Redirects back to client.
      operationId: post_oauth2_consent
      parameters:
      - description: Client identifier (required)
        in: query
        name: client_id
        required: true
        schema:
          type: string
      - description: User identifier (required)
        in: query
        name: user_id
        required: true
        schema:
          type: string
      - description: Requested scope to consent (required)
        in: query
        name: scope
        required: true
        schema:
          type: string
      - description: Redirect URI (required)
        in: query
        name: redirect_uri
        required: true
        schema:
          type: string
      - description: Opaque value to maintain state
        in: query
        name: state
        required: false
        schema:
          type: string
      - description: 'Action to perform: ''approve'' or ''deny'' (required)'
        in: query
        name: action
        required: true
        schema:
          enum:
          - approve
          - deny
          type: string
      - description: Server-minted one-shot CSRF nonce from the authorize->consent redirect (required; consumed on use)
        in: query
        name: consent_csrf
        required: true
        schema:
          type: string
      responses:
        '302':
          description: Redirect to client with authorization code or error
        '400':
          description: Missing/expired/mismatched consent_csrf nonce, or (deny) redirect_uri not registered for the client (VALIDATION_INVALID_INPUT / VALIDATION_REDIRECT_URI_NOT_REGISTERED)
        '401':
          description: 'No authenticated session (AUTH_SESSION_REQUIRED), or the
            session is paused at the MFA challenge (AUTH_MFA_REQUIRED, #144:
            consent must not be granted on amr="pwd" for an MFA-required account)'
        '403':
          description: 'user_id does not match the authenticated session
            (AUTHZ_ACCESS_DENIED), or the account is flagged must_change_password
            (AUTH_PASSWORD_CHANGE_REQUIRED, #145)'
      summary: Submit user consent
      tags:
      - OAuth2
      - Consent
  /oauth2/device/approve:
    post:
      description: >-
        Admin-only approval of a pending device authorization (RFC 8628 user
        approval step). Requires an admin Bearer token (AuthorizationFilter).
      operationId: post_oauth2_device_approve
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - user_code
              - user_id
              properties:
                user_code:
                  type: string
                  description: The user_code shown to the user by the device.
                user_id:
                  type: string
                  description: Approving user's identifier.
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: approved
                  user_code:
                    type: string
          description: Device authorization approved
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing user_code/user_id, or the code is invalid/already processed/expired
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Insufficient permissions (admin role / scope required)
      security:
      - bearerAuth: []
      summary: Approve Device Authorization
      tags:
      - OAuth2
      - Device Flow
  /oauth2/device_authorization:
    post:
      description: 'RFC 8628 device authorization endpoint. A CONFIDENTIAL client
        authenticates with client_secret (HTTP Basic preferred); a PUBLIC client
        sends client_id only. The user then visits verification_uri and an admin
        approves via /oauth2/device/approve; the device polls /oauth2/token with
        grant_type=urn:ietf:params:oauth:grant-type:device_code.'
      operationId: post_oauth2_device_authorization
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - client_id
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                  description: Required for CONFIDENTIAL clients (send via HTTP Basic when possible).
                scope:
                  type: string
                  description: Space-separated requested scopes (optional).
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAuthorizationResponse'
          description: Device authorization response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_request (missing client_id)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_client (unknown client / bad secret)
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: server_error
      summary: Device Authorization
      tags:
      - OAuth2
      - Device Flow
  /oauth2/end_session:
    get:
      description: 'OIDC RP-Initiated Logout 1.0 §2. Terminates the user''s server-side
        session and (optionally) redirects to a registered post_logout_redirect_uri.
        When id_token_hint is supplied it MUST pass end-to-end verification (#78:
        RS256 signature against the OP key set, strict alg/kid, iss, exp) — any
        failure, or a hint subject that contradicts the browser session, is
        rejected with 400 AUTH_INVALID_ID_TOKEN_HINT (Error Envelope). post_logout_redirect_uri
        MUST be registered for the client identifying itself in the request: the
        verified id_token_hint (its aud claim) or, when no hint is supplied, the
        client_id parameter (RP-Initiated Logout 1.0 §2.1 defines client_id for
        exactly this case, #88-3). With NEITHER hint nor client_id a redirect URI
        is rejected with 400. Accepts both GET (link-based) and POST
        (form-based).'
      operationId: get_oauth2_end_session
      parameters:
      - description: 'Previously issued id_token hinting at the client/session to
          terminate. Signature-verified against the OP key set (#78); a bad or
          expired signature, wrong issuer, or a subject contradicting the current
          session yields 400 AUTH_INVALID_ID_TOKEN_HINT. The aud claim (string or array,
          RFC 7519 §4.1.3) identifies the client(s) for validating
          post_logout_redirect_uri; the first candidate owning the URI wins.'
        in: query
        name: id_token_hint
        required: false
        schema:
          type: string
      - description: URI to redirect to after logout. Must be registered for the
          id_token_hint client; rejected with 400 otherwise.
        in: query
        name: post_logout_redirect_uri
        required: false
        schema:
          type: string
      - description: 'RP self-identification when id_token_hint is absent
          (RP-Initiated Logout 1.0 §2.1). The post_logout_redirect_uri must be
          registered for this client (#88-3).'
        in: query
        name: client_id
        required: false
        schema:
          type: string
      - description: Opaque value echoed back to the post_logout_redirect_uri.
        in: query
        name: state
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Logged out (no post_logout_redirect_uri supplied)
        '302':
          description: Redirect to the validated post_logout_redirect_uri (with state)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Error Envelope. (a) id_token_hint failed verification/expired/issuer
            mismatch/session-subject mismatch/aud without a usable client identifier:
            AUTH_INVALID_ID_TOKEN_HINT; (b) post_logout_redirect_uri supplied without an
            id_token_hint: AUTH_INVALID_ID_TOKEN_HINT; (c) post_logout_redirect_uri not
            registered for any aud client of the verified hint:
            VALIDATION_REDIRECT_URI_NOT_REGISTERED.'
      summary: RP-Initiated Logout
      tags:
      - OAuth2
      - OIDC
    post:
      description: 'OIDC RP-Initiated Logout (POST form-based variant; see GET for
        semantics). id_token_hint, when supplied, is signature-verified (#78);
        verification failure yields 400 AUTH_INVALID_ID_TOKEN_HINT Error Envelope.'
      operationId: post_oauth2_end_session
      parameters:
      - description: Previously issued id_token hint (signature-verified, #78).
        in: query
        name: id_token_hint
        required: false
        schema:
          type: string
      - description: 'RP self-identification when id_token_hint is absent
          (RP-Initiated Logout 1.0 §2.1). The post_logout_redirect_uri must be
          registered for this client (#88-3).'
        in: query
        name: client_id
        required: false
        schema:
          type: string
      - description: Registered post-logout redirect URI.
        in: query
        name: post_logout_redirect_uri
        required: false
        schema:
          type: string
      - description: Opaque state value.
        in: query
        name: state
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Logged out
        '302':
          description: Redirect to post_logout_redirect_uri
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Error Envelope: id_token_hint verification failure, or neither
            id_token_hint nor client_id supplied with a post_logout_redirect_uri
            (AUTH_INVALID_ID_TOKEN_HINT), or post_logout_redirect_uri not registered
            for the identifying client (VALIDATION_REDIRECT_URI_NOT_REGISTERED).
            See GET for full semantics.'
      summary: RP-Initiated Logout (POST)
      tags:
      - OAuth2
      - OIDC
  /oauth2/introspect:
    post:
      description: RFC 7662 OAuth 2.0 Token Introspection. Returns information about
        a token. The calling client MUST authenticate (HTTP Basic preferred;
        client_id/client_secret form parameters accepted).
      operationId: post_oauth2_introspect
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: The string value of the token (required).
                token_type_hint:
                  type: string
                  description: 'Optional hint: access_token or refresh_token (accepted, currently ignored).'
                client_id:
                  type: string
                  description: Client identifier (alternative to HTTP Basic authentication).
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic authentication).
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntrospectionResponse'
          description: 'Token status and metadata ({"active": false} for unknown/inactive tokens)'
          headers:
            Cache-Control:
              description: Always "no-store".
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_request (missing token)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_client (authentication failed / auth-method mismatch)
          headers:
            WWW-Authenticate:
              description: Basic realm challenge when HTTP Basic was attempted.
              schema:
                type: string
        '429':
          description: 'Too Many Requests -- F-018 rate limit tripped by repeated
            failed authentication/validation attempts for this (client_ip, client_id).
            Accompanied by a Retry-After header and an OAuth2-style {error:
            invalid_request, error_description} body.'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
      security:
      - clientCredentialsAuth: []
      summary: Introspect token
      tags:
      - OAuth2
      - Token
  /oauth2/login:
    post:
      description: Authenticates user credentials and generates an authorization code.
        Usually called by the frontend login page during the authorization code flow.
        Accepts a JSON body or form-encoded parameters; when MFA is enabled on the
        account the response defers to POST /oauth2/mfa/verify.
      operationId: post_oauth2_login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/LoginSuccessResponse'
                - $ref: '#/components/schemas/MfaRequiredResponse'
                - $ref: '#/components/schemas/PasswordChangeRequiredResponse'
              examples:
                success:
                  summary: Login succeeded (json=true)
                  value:
                    code: xyz123
                    location: http://127.0.0.1:5173/callback?code=xyz123&state=abc
                mfa_required:
                  summary: MFA challenge required
                  value:
                    mfa_required: true
                    mfa_token: '42'
                    message: MFA verification required. Submit TOTP code to /oauth2/mfa/verify
                password_change_required:
                  summary: Forced first-login password change (#145)
                  value:
                    password_change_required: true
                    message: Password change required. Change the password via
                      POST /oauth2/password/change before signing in
          description: 'Authentication outcome: authorization code issued (JSON with
            code/location when json=true), MFA challenge deferred, or a forced
            password-change request while the account is flagged
            must_change_password (bootstrap admin / admin-created users; no code
            is issued until the password is changed)'
        '302':
          description: Redirect with authorization code (browser flow / json omitted);
            PKCE-missing errors also redirect with ?error=... to a verified redirect_uri
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing username/password (VALIDATION_INVALID_INPUT)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication failed (AUTH_INVALID_CREDENTIALS)
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Email not verified (AUTHZ_ACCESS_DENIED)
      summary: Authenticate user
      tags:
      - OAuth2
      - Authentication
  /oauth2/logout:
    post:
      description: Terminates the server-side session behind the presented Bearer
        access token (also fires OIDC back-channel logout notifications when
        configured).
      operationId: post_oauth2_logout
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Logged out successfully
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Missing/invalid Bearer token
      security:
      - bearerAuth: []
      summary: Logout
      tags:
      - OAuth2
      - Session
  /oauth2/mfa/verify:
    post:
      description: Verify MFA (TOTP) code during login. Completes the
        authorization-code issuance started by /oauth2/login when MFA was
        required. The PKCE code_verifier (C4, RFC 7636) must be supplied so
        the internally-generated code passes PKCE verification against the
        code_challenge persisted on the session during the first-factor
        login step. Accepts a JSON body or form-encoded parameters.
      operationId: post_oauth2_mfa_verify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/TokenResponse'
                - type: object
                  properties:
                    message:
                      type: string
                    mfa_verified:
                      type: boolean
          description: MFA verification successful — returns the token pair
            (access_token, refresh_token, id_token).
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request (missing mfa_token/code, malformed TOTP)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid MFA code or client/redirect mismatch
      summary: Verify MFA Code (Login)
      tags:
      - MFA
  /oauth2/password/change:
    post:
      description: 'Changes the password of the session user while the account is
        flagged must_change_password (#145: bootstrap admin, admin-created users).
        Session-authenticated like /oauth2/login (no Bearer token — a flagged
        account cannot obtain tokens by design); requires old_password, applies
        the auth.min_password_length policy and a 128-character maximum, clears
        the flag, revokes all access/refresh tokens, and demotes the session to
        anonymous (sign in again). Only usable while the session carries the
        must_change_password marker set at login. JSON body only — the endpoint
        has no CSRF nonce of its own, so the content type (which a cross-site
        form cannot produce) plus the old_password knowledge factor close the
        cross-site surface.'
      operationId: post_oauth2_password_change
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - old_password
              - new_password
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  description: Must satisfy auth.min_password_length (default 8)
                    and is capped at 128 characters.
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: Password changed; the must_change_password flag is cleared,
            all tokens revoked, and the session demoted to anonymous. Sign in
            again to continue.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'Non-JSON body (VALIDATION_INVALID_INPUT), missing fields
            (VALIDATION_MISSING_REQUIRED_FIELD), new password below the configured
            minimum (VALIDATION_PASSWORD_TOO_SHORT) or above 128 characters
            (VALIDATION_INVALID_INPUT)'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: 'No session / session without the must_change_password marker
            (AUTH_SESSION_REQUIRED), account locked (AUTH_INVALID_CREDENTIALS),
            or wrong old_password (AUTH_INVALID_CREDENTIALS)'
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Database failure (DB_QUERY_ERROR)
      summary: Change Password (Forced First-Login Flow)
      tags:
      - Session
  /oauth2/register:
    post:
      description: Dynamic client registration.
      operationId: post_oauth2_register
      responses:
        '201':
          description: Client registered successfully
        '400':
          description: Invalid client metadata
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Register Client
      tags:
      - OAuth2
      - Dynamic Registration
  /oauth2/revoke:
    post:
      description: "RFC 7009 OAuth 2.0 Token Revocation. Revokes an access OR
        refresh token (C3 fix — refresh tokens are now actually revoked, not
        silently no-op'd). The caller must be the token's owning client
        (ownership enforced via introspection). CONFIDENTIAL clients
        authenticate via client_secret (HTTP Basic or body); PUBLIC clients
        (token_endpoint_auth_method='none') authenticate with client_id only
        (RFC 7009 §2.1 exempts them from client authentication at this
        endpoint). Unknown or already-inactive tokens still return 200 per
        RFC 7009; the success body is EMPTY."
      operationId: post_oauth2_revoke
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                  description: The token that the client wants to get revoked (required).
                token_type_hint:
                  type: string
                  description: 'Optional hint: access_token or refresh_token (accepted, currently ignored).'
                client_id:
                  type: string
                  description: Client identifier (alternative to HTTP Basic authentication).
                client_secret:
                  type: string
                  description: Client secret (alternative to HTTP Basic; required for CONFIDENTIAL clients).
      responses:
        '200':
          description: Token revoked successfully or token did not exist (empty body)
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_request (missing token)
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_client (authentication failed)
        '429':
          description: 'Too Many Requests -- F-018 rate limit tripped by repeated
            failed authentication/validation attempts for this (client_ip, client_id).
            Accompanied by a Retry-After header and an OAuth2-style {error:
            invalid_request, error_description} body.'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
      security:
      - clientCredentialsAuth: []
      - {}
      summary: Revoke token
      tags:
      - OAuth2
      - Token
  /oauth2/token:
    post:
      description: 'OAuth2 token endpoint - exchanges an authorization code,
        refresh token, client credentials, or device code for access tokens
        (RFC 6749 §3.2). Request parameters are sent as
        application/x-www-form-urlencoded (the server also accepts them as
        query parameters). Client authentication follows each client''s
        registered token_endpoint_auth_method (F-017): client_secret_basic
        (the default) -> HTTP Basic ONLY (a body client_secret is rejected);
        client_secret_post -> client_id + client_secret form fields ONLY (a
        Basic header is rejected); PUBLIC clients send client_id only (any
        client_secret is rejected).'
      operationId: post_oauth2_token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
          description: 'Token response with access_token and refresh_token. F-019
            (RFC 6749 §5.1): success responses carry Cache-Control: no-store and
            Pragma: no-cache and MUST NOT be cached.'
          headers:
            Cache-Control:
              description: Always "no-store" -- token responses MUST NOT be cached.
              schema:
                type: string
            Pragma:
              description: Always "no-cache" (HTTP/1.0 back-compat fallback).
              schema:
                type: string
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: >-
            invalid_request / invalid_grant / unsupported_grant_type /
            invalid_scope; device grant also returns authorization_pending,
            slow_down (plus non-standard interval field), expired_token, or
            access_denied here.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: invalid_client (authentication failed / forbidden secret on a PUBLIC client)
          headers:
            WWW-Authenticate:
              description: Basic realm challenge when HTTP Basic was attempted.
              schema:
                type: string
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: 'Too Many Requests -- F-018 rate limit tripped by repeated
            failed authentication/validation attempts for this (client_ip, client_id),
            including device_code polling. Accompanied by a Retry-After header.'
          headers:
            Retry-After:
              description: Seconds to wait before retrying.
              schema:
                type: integer
      summary: Exchange authorization code for access token
      tags:
      - OAuth2
      - Token
  /oauth2/userinfo:
    get:
      description: 'Returns information about the authenticated user. F-023 (OIDC
        Core §5.3): the access token''s scope MUST include openid; M2M tokens
        (client_credentials, subject client:*) are rejected. The response
        includes the email_verified claim (F-024) when an email is present.'
      operationId: get_oauth2_userinfo
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
          description: User information retrieved successfully
        '400':
          description: Invalid User ID format
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: 'Invalid/expired access token (invalid_token), or M2M token:
            client-credentials tokens have no user identity for userinfo'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuth2Error'
          description: 'insufficient_scope -- the access token lacks the openid scope
            (RFC 6750 §3; accompanied by WWW-Authenticate: Bearer error="insufficient_scope")'
        '404':
          content:
            application/json:
              example:
                error: User not found
          description: User not found
      security:
      - bearerAuth: []
      summary: Get user information
      tags:
      - OAuth2
      - User
  /oauth2/webauthn/authenticate/begin:
    post:
      description: 'Start passkey authentication (#142): the challenge is bound to
        the caller''s session (send cookies - credentials include); userVerification=required;
        ES256 only. Requires webauthn.rp_origins.'
      operationId: post_oauth2_webauthn_authenticate_begin
      responses:
        '200':
          description: WebAuthn authentication options
      summary: WebAuthn Authenticate Begin
      tags:
      - WebAuthn
  /oauth2/webauthn/authenticate/finish:
    post:
      description: 'Finish passkey authentication (#142): the session challenge is
        consumed unconditionally, the ES256 signature over authData || SHA256(clientDataJSON)
        is verified against the STORED COSE key, UV=1 is enforced and signCount
        regression is treated as cloning. On success a browser session is
        established (Set-Cookie). All failures answer the generic
        AUTH_INVALID_CREDENTIALS.'
      operationId: post_oauth2_webauthn_authenticate_finish
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebAuthnAssertionCredential'
        required: true
      responses:
        '200':
          description: WebAuthn authentication successful
        '400':
          description: Invalid request
        '401':
          description: Authentication failed (generic - credential, signature,
            challenge or policy)
      summary: WebAuthn Authenticate Finish
      tags:
      - WebAuthn
servers:
- description: Default server (relative path)
  url: /
