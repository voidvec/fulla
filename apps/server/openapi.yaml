# OpenAPI 3.0 specification of the Fulla OAuth2/OIDC authorization server.
#
# Governance (2026-08, spec-governance M0):
#   - This file is the SINGLE SOURCE OF TRUTH for the HTTP API contract
#     (client SDK generation, endpoint consistency gate, breaking-change gate).
#   - tools/openapi-governance/check_spec_governance.py (CI static-checks)
#     asserts: METHOD+path set == C++ doc registrations == Drogon routes
#     (modulo documented exclusions), and info.version == cmake/Version.cmake.
#   - .github/workflows/openapi-governance.yml runs `oasdiff breaking` against
#     the base branch; breaking changes require a major bump or an entry in
#     tools/openapi-governance/oasdiff-breaking-ignore.md.
#   - After editing controllers or this file, run:
#       python tools/openapi-governance/check_spec_governance.py
#       python -m openapi_spec_validator apps/server/openapi.yaml
components:
  schemas:
    Error:
      description: >-
        The nested error object of the application error envelope. Application
        (non-OAuth2-protocol) endpoints respond with {"error": {...}} on
        failure; /oauth2/* and /.well-known/* endpoints use RFC 6749 §5.2
        bodies instead (see OAuth2Error).
      properties:
        category:
          type: string
          description: Error category, e.g. VALIDATION / AUTH / AUTHZ / DB / INTERNAL.
        code:
          type: string
          description: Machine-readable error code, e.g. VALIDATION_INVALID_INPUT.
        message:
          type: string
        request_id:
          type: string
        numeric_code:
          type: integer
          description: Numeric catalog code (present iff the code is registered, e.g. 3001).
        details:
          type: string
          description: Extra context; only emitted when the server runs in non-production mode.
      type: object
    ErrorEnvelope:
      description: Application-endpoint error wrapper.
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
      type: object
    OAuth2Error:
      description: >-
        RFC 6749 §5.2 error body used by /oauth2/* and /.well-known/*
        endpoints (with Cache-Control: no-store). HTTP status per code:
        invalid_request 400, invalid_client 401, invalid_grant 400,
        unauthorized_client 400, unsupported_grant_type 400, invalid_scope 400,
        access_denied 403, authorization_pending 400, slow_down 400,
        expired_token 400, server_error 500, temporarily_unavailable 503.
        Bearer-protected resources (userinfo) additionally use the RFC 6750
        section 3.1 codes invalid_token (401) and insufficient_scope (403).
      properties:
        error:
          type: string
          enum:
          - invalid_request
          - invalid_client
          - invalid_grant
          - unauthorized_client
          - unsupported_grant_type
          - invalid_scope
          - access_denied
          - unsupported_token_type
          - invalid_token
          - insufficient_scope
          - authorization_pending
          - slow_down
          - expired_token
          - server_error
          - temporarily_unavailable
        error_description:
          type: string
        error_uri:
          type: string
      required:
      - error
      type: object
    TokenResponse:
      description: >-
        Token endpoint success body (grant-dependent fields). authorization_code:
        access_token/token_type/expires_in/refresh_token/roles + id_token iff
        scope includes openid (no scope echo). refresh_token: rotated
        refresh_token, no roles. client_credentials: scope echo, NO
        refresh_token. device_code: refresh_token + optional scope/id_token.
        Always carries Cache-Control: no-store / Pragma: no-cache.
      properties:
        access_token:
          type: string
        token_type:
          type: string
          description: Always "Bearer".
        expires_in:
          type: integer
          format: int64
          description: Seconds until access_token expiry.
        refresh_token:
          type: string
          description: Present for grants that issue refresh tokens (rotated on refresh).
        scope:
          type: string
          description: Space-separated scopes; echoed for client_credentials/device grants only.
        roles:
          type: array
          items:
            type: string
          description: Role names; authorization_code grant only.
        id_token:
          type: string
          description: OIDC ID token (JWT); present iff scope includes openid and signing keys are configured.
      required:
      - access_token
      - token_type
      - expires_in
      type: object
    SocialLoginTokenResponse:
      description: >-
        First-party token pair issued by a social login endpoint
        (/api/{github,google,wechat}/login) once the provider identity is
        linked to a local account (or auto-created on first login). Issued
        for the configured first-party client
        (external_auth.social_token_client_id, default vue-client) with
        scope "openid profile email". Recorded as a SOCIAL_LOGIN_TOKEN_ISSUED
        audit event (NOT a consent row) — an explicit social-consent
        interaction is a registered follow-up.
      properties:
        access_token:
          type: string
        token_type:
          type: string
          description: Always "Bearer".
        expires_in:
          type: integer
          format: int64
        refresh_token:
          type: string
      required:
      - access_token
      - token_type
      - expires_in
      - refresh_token
      type: object
    WebAuthnRegistrationCredential:
      description: >-
        Browser PublicKeyCredential for navigator.credentials.create()
        (#142). All binary fields are base64url without padding. The server
        ignores any client-submitted public_key: the stored key comes from
        the verified attestation object's COSE bytes.
      properties:
        id:
          type: string
          description: base64url credential id (must equal rawId).
        rawId:
          type: string
        response:
          type: object
          properties:
            attestationObject:
              type: string
              description: base64url CBOR attestation object (fmt "none" only).
            clientDataJSON:
              type: string
          required:
          - attestationObject
          - clientDataJSON
        name:
          type: string
          description: Optional human-readable label (default "Passkey").
      required:
      - id
      - rawId
      - response
      type: object
    WebAuthnAssertionCredential:
      description: >-
        Browser PublicKeyCredential for navigator.credentials.get() (#142).
        All binary fields are base64url without padding.
      properties:
        id:
          type: string
          description: base64url credential id (must equal rawId).
        rawId:
          type: string
        response:
          type: object
          properties:
            authenticatorData:
              type: string
            clientDataJSON:
              type: string
            signature:
              type: string
              description: base64url ASN.1 DER ECDSA signature.
          required:
          - authenticatorData
          - clientDataJSON
          - signature
        userHandle:
          type: string
          description: Optional base64url user handle; when present it must
            name the credential's owner.
      required:
      - id
      - rawId
      - response
      type: object
    IntrospectionResponse:
      description: >-
        RFC 7662 introspection body. Inactive tokens return {"active": false}
        only. Active responses always carry iss (backfilled from config);
        Cache-Control: no-store.
      properties:
        active:
          type: boolean
        client_id:
          type: string
        token_type:
          type: string
          description: Always "Bearer" when active.
        exp:
          type: integer
          format: int64
        iat:
          type: integer
          format: int64
        nbf:
          type: integer
          format: int64
        sub:
          type: string
          description: Resource-owner subject; "client:<id>" for client_credentials tokens.
        aud:
          type: string
        iss:
          type: string
        scope:
          type: string
          description: Space-separated scopes.
      required:
      - active
      type: object
    UserInfoResponse:
      description: >-
        OIDC Core §5.3 userinfo claims. email_verified present iff email
        present; roles present iff non-empty.
      properties:
        sub:
          type: string
          description: Subject (public user id, stringified).
        name:
          type: string
          description: 'Username (fallback: email, then sub).'
        username:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        roles:
          type: array
          items:
            type: string
      required:
      - sub
      - name
      type: object
    OpenIDConfiguration:
      description: OIDC Discovery 1.0 provider metadata.
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        device_authorization_endpoint:
          type: string
        userinfo_endpoint:
          type: string
        jwks_uri:
          type: string
        introspection_endpoint:
          type: string
        revocation_endpoint:
          type: string
        registration_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        prompt_values_supported:
          type: array
          items:
            type: string
        acr_values_supported:
          type: array
          items:
            type: string
        end_session_endpoint:
          type: string
        backchannel_logout_supported:
          type: boolean
        backchannel_logout_session_supported:
          type: boolean
        claims_supported:
          type: array
          items:
            type: string
      type: object
    OAuthAuthorizationServerMetadata:
      description: RFC 8414 authorization server metadata (no userinfo/jwks entries; OIDC discovery carries those).
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        device_authorization_endpoint:
          type: string
        introspection_endpoint:
          type: string
        introspection_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        revocation_endpoint:
          type: string
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        registration_endpoint:
          type: string
        scopes_supported:
          type: array
          items:
            type: string
        response_types_supported:
          type: array
          items:
            type: string
        response_modes_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        service_documentation:
          type: string
        op_policy_uri:
          type: string
        op_tos_uri:
          type: string
      type: object
    JWKSet:
      description: 'RFC 7517 JSON Web Key Set (Cache-Control: public, max-age=3600).'
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              kty:
                type: string
              kid:
                type: string
              use:
                type: string
              alg:
                type: string
              n:
                type: string
              e:
                type: string
              x5c:
                type: array
                items:
                  type: string
            required:
            - kty
      required:
      - keys
      type: object
    LoginSuccessResponse:
      description: /oauth2/login success when json=true (otherwise a 302 redirect with code+state query).
      properties:
        code:
          type: string
          description: The issued authorization code.
        location:
          type: string
          description: Full redirect URI with code and state query parameters.
      required:
      - code
      - location
      type: object
    MfaRequiredResponse:
      description: /oauth2/login response when the account has MFA enabled; complete the flow at POST /oauth2/mfa/verify.
      properties:
        mfa_required:
          type: boolean
        mfa_token:
          type: string
          description: Pending-MFA token to submit to /oauth2/mfa/verify.
        message:
          type: string
      required:
      - mfa_required
      - mfa_token
      type: object
    PasswordChangeRequiredResponse:
      description: '/oauth2/login response while the account is flagged must_change_password
        (#145: bootstrap admin, admin-created users). No authorization code is
        issued until the password is changed via POST /oauth2/password/change.'
      properties:
        password_change_required:
          type: boolean
        message:
          type: string
      required:
      - password_change_required
      type: object
    MessageResponse:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    SocialLinkEntry:
      description: One social provider identity linked to the current user.
      properties:
        provider:
          type: string
          enum: [github, google, wechat]
        subject:
          type: string
          description: Provider-scoped stable id (GitHub numeric id, Google
            sub, WeChat openid).
        linked_at:
          type: string
          description: Mapping row creation timestamp.
      required:
      - provider
      - subject
      type: object
    SocialLinksList:
      properties:
        social_links:
          type: array
          items:
            $ref: '#/components/schemas/SocialLinkEntry'
        total:
          type: integer
      required:
      - social_links
      - total
      type: object
    SocialLinkResult:
      description: Result of a link/unlink mutation.
      properties:
        provider:
          type: string
          enum: [github, google, wechat]
        subject:
          type: string
          description: Provider subject (link success; unlink success keeps
            the removed subject).
        message:
          type: string
      required:
      - provider
      - message
      type: object
    DeviceAuthorizationResponse:
      description: 'RFC 8628 device authorization response. The verification URIs
        point at the admin console device-approval page by default (admin_console.url
        config + /admin/devices, #146); override with
        custom_config.device_authorization.verification_uri.'
      properties:
        device_code:
          type: string
        user_code:
          type: string
          description: 8 characters from the A-Z2-9 alphabet (no 0/1/I/O).
        verification_uri:
          type: string
          description: Page the user visits to approve the device (admin console
            /admin/devices by default).
        verification_uri_complete:
          type: string
          description: 'verification_uri with ?user_code=<code> appended (RFC 8628
            §3.3.1) so the approval page can prefill the code.'
        expires_in:
          type: integer
          description: Device code lifetime in seconds (600).
        interval:
          type: integer
          description: Required polling interval in seconds (5).
      required:
      - device_code
      - user_code
      - verification_uri
      - expires_in
      - interval
      type: object
    HealthStatus:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unhealthy
        service:
          type: string
        timestamp:
          type: integer
          format: int64
        storage_type:
          type: string
        database:
          type: string
          description: connected / disconnected / not_configured / unknown
        redis:
          type: string
          description: connected / disconnected / not_configured
      required:
      - status
      type: object
    Organization:
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        logo_uri:
          type: string
        primary_color:
          type: string
        issuer_override:
          type: string
      type: object
    TokenRequest:
      description: >-
        RFC 6749 §4.1.3 token request (form-encoded). Field requirements are
        grant-dependent: authorization_code needs code (+ redirect_uri +
        code_verifier when PKCE was used); refresh_token needs refresh_token;
        client_credentials may send scope; device_code needs device_code.
        Client auth follows the client's registered
        token_endpoint_auth_method (F-017): client_secret_basic (default)
        -> HTTP Basic ONLY; client_secret_post -> these form fields ONLY;
        'none' (PUBLIC) -> client_id only, secrets rejected.
      properties:
        grant_type:
          type: string
          enum:
          - authorization_code
          - refresh_token
          - client_credentials
          - urn:ietf:params:oauth:grant-type:device_code
        code:
          type: string
          description: Authorization code (required for grant_type=authorization_code).
        redirect_uri:
          type: string
          description: Required for the authorization_code grant.
        refresh_token:
          type: string
          description: Required for grant_type=refresh_token (rotated on use).
        code_verifier:
          type: string
          description: 'PKCE code_verifier (RFC 7636): required for
            authorization_code when the login/authorize request carried a
            code_challenge.'
        client_id:
          type: string
          description: Client identifier (alternative to HTTP Basic authentication).
        client_secret:
          type: string
          description: Client secret for CONFIDENTIAL clients with
            token_endpoint_auth_method=client_secret_post; FORBIDDEN for
            PUBLIC clients whose method is 'none' (F-017).
        scope:
          type: string
          description: Space-separated scopes (client_credentials grant only).
        device_code:
          type: string
          description: Required for the device_code grant (from
            /oauth2/device_authorization).
      required:
      - grant_type
      type: object
    LoginRequest:
      description: /oauth2/login credentials (JSON body or form-encoded; query also accepted).
      properties:
        username:
          type: string
          description: Account username or email.
        password:
          type: string
        client_id:
          type: string
          description: Matches the requesting app (required for code issuance).
        redirect_uri:
          type: string
          description: Must match the registered client.
        scope:
          type: string
          description: Space-separated (optional).
        state:
          type: string
          description: Opaque value maintained between request and callback (recommended).
        code_challenge:
          type: string
          description: PKCE code challenge (RFC 7636). REQUIRED for PUBLIC
            clients (vue-client, admin-console) when
            auth.require_pkce_for_public is enabled (default true, F-011 /
            RFC 9700 §2.1.1). The matching code_verifier must be sent on the
            /oauth2/token exchange.
        code_challenge_method:
          type: string
          description: 'S256 (recommended) or plain.'
        nonce:
          type: string
          description: OIDC nonce (anti-replay), echoed in the id_token.
        json:
          type: string
          description: 'Set to "true" to receive a JSON body instead of a 302 redirect.'
      required:
      - username
      - password
      type: object
    MfaVerifyRequest:
      description: /oauth2/mfa/verify completion payload (JSON body or form-encoded).
      properties:
        mfa_token:
          type: string
          description: The MFA pending token returned by /oauth2/login when
            mfa_required was true.
        code:
          type: string
          description: The 6-digit TOTP code from the user's authenticator.
        client_id:
          type: string
          description: Must match the first-factor login.
        redirect_uri:
          type: string
          description: Must match the first-factor login.
        scope:
          type: string
          description: Defaults to "openid profile email".
        nonce:
          type: string
        code_verifier:
          type: string
          description: PKCE code_verifier matching the code_challenge sent on
            the first-factor /oauth2/login step. Required for PUBLIC clients.
      required:
      - mfa_token
      - code
      - client_id
      - redirect_uri
      type: object
  securitySchemes:
    bearerAuth:
      scheme: bearer
      type: http
    clientCredentialsAuth:
      description: 'OAuth2 client authentication (RFC 6749 §2.3): client_id and client_secret
        via HTTP Basic Authorization header or POST body parameters.'
      scheme: basic
      type: http
info:
  description: OAuth2.0 authorization server with token management
  title: OAuth2 Authorization Server API
  version: 1.2.0
openapi: 3.0.0
paths:
  /.well-known/jwks.json:
    get:
      description: Returns the public keys used by this server to sign JWTs. With a
        signing keystore configured (#110) EVERY loaded key is published so tokens
        keep verifying across the rotation grace window; the active signer is the
        kid the issued JWT headers carry.
      operationId: get_.well-known_jwks.json
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSet'
          description: JSON Web Key Set
      summary: JSON Web Key Set
      tags:
      - OpenID Connect
      - Security
  /.well-known/oauth-authorization-server:
    get:
      description: RFC 8414 OAuth 2.0 Authorization Server Metadata. Unlike the OIDC
        discovery document this carries no userinfo/jwks entries.
      operationId: get_.well-known_oauth-authorization-server
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizationServerMetadata'
          description: Authorization Server Metadata
      summary: OAuth 2.0 Authorization Server Metadata
      tags:
      - OAuth2
      - Discovery
  /.well-known/openid-configuration:
    get:
      description: Returns OIDC discovery metadata including endpoints and supported
        scopes.
      operationId: get_.well-known_openid-configuration
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'
          description: OIDC Provider Metadata
      summary: OpenID Connect Discovery
      tags:
      - OpenID Connect
  /api/admin/clients:
    get:
      description: Get a paginated list of registered OAuth2 clients.
      operationId: get_api_admin_clients
      responses:
        '200':
          description: List of OAuth2 clients
        '401':
          description: Unauthorized
        '403':
          description: 'insufficient_scope / insufficient permissions -- the access
            token lacks the `admin` scope OR the user lacks the admin role (RFC 6750
            §3; on a scope failure accompanied by WWW-Authenticate: Bearer
            error="insufficient_scope", scope="admin"). F-010: /api/admin/* requires
            the `admin` scope in addition to the RBAC admin role.'
      security:
      - bearerAuth: []
      summary: List OAuth2 Clients
      tags:
      - Admin
      - Clients
    post:
      description: Register a new OAuth2 client.
      operationId: post_api_admin_clients
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                client_type:
                  type: string
                  enum:
                  - CONFIDENTIAL
                  - PUBLIC
                  default: CONFIDENTIAL
                redirect_uris:
                  type: string
                  description: Comma-separated redirect URIs (https required).
                allowed_grant_types:
                  type: string
                  default: authorization_code
                token_endpoint_auth_method:
                  type: string
                backchannel_logout_uri:
                  type: string
                  format: uri
                  description: OIDC Back-Channel Logout 1.0 RP endpoint. MUST
                    use https (spec §2.3). When set, the OP POSTs a signed
                    logout_token here on user logout.
      responses:
        '201':
          description: Client created successfully
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: Create OAuth2 Client
      tags:
      - Admin
      - Clients
  /api/admin/clients/{clientId}:
    delete:
      description: Delete a specific OAuth2 client.
      operationId: delete_api_admin_clients_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Delete OAuth2 Client
      tags:
      - Admin
      - Clients
    get:
      description: Get details of a specific OAuth2 client by ID.
      operationId: get_api_admin_clients_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Client details
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Get Client Details
      tags:
      - Admin
      - Clients
    put:
      description: Update details of a specific OAuth2 client.
      operationId: put_api_admin_clients_{clientId}
      parameters:
      - description: Client ID
        in: path
        name: clientId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                redirect_uris:
                  type: string
                allowed_grant_types:
                  type: string
                backchannel_logout_uri:
                  type: string
                  format: uri
                  description: Set to an https URI to enable OIDC back-channel
                    logout notifications to this RP; an empty string clears it.
      responses:
        '200':
          description: Client updated successfully
        '400':
          description: Invalid request body
        '401':
          description: Unauthorized
        '404':
          description: Client not found
      security:
      - bearerAuth: []
      summary: Update OAuth2 Client
      tags:
      - Admin
      - Clients
  /api/admin/clients/{clientId}/reset-secret:
    post:
      description: Reset the secret of a specific OAuth2 client.
